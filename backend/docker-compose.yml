
services:
  db:
    image: postgres:17-alpine
    container_name: metapay-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: metapay
      POSTGRES_USER: metapay
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - metapay_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metapay -d metapay"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  metapay_data:
